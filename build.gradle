plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Lets SRG-mapped mixins of the integration JARs (Puffish Skills, Curios, CoroUtil) apply in dev runs.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test // GameTests and their arena (dev runs only)
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
    }
}

repositories {
    // Local copy of the profile's TaCZ JAR for compiling the gunshot hook (never packaged).
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // TaCZ GunFireEvent: optional at runtime, the hook is only registered when TaCZ is loaded.
    compileOnly fg.deobf("blank:tacz:1.1.8")
    testCompileOnly fg.deobf("blank:tacz:1.1.8")
    // The pack's JARs, only for the integration GameTests (dev runtime; never compiled against or packaged).
    runtimeOnly fg.deobf("blank:tacz:1.1.8")
    runtimeOnly fg.deobf("blank:zombieawareness:1.13.1")
    runtimeOnly fg.deobf("blank:coroutil:1.3.7")
    runtimeOnly fg.deobf("blank:dualhitboxzombies:1.0.0")
    runtimeOnly fg.deobf("blank:encumbered:0.99")
    runtimeOnly fg.deobf("blank:peakstamina:2.2.2")
    runtimeOnly fg.deobf("blank:puffish_skills:0.19.2")
    runtimeOnly fg.deobf("blank:lazarusmoodles:1.15.1")
    runtimeOnly fg.deobf("blank:apocalypsenow:3.0.5")
    runtimeOnly fg.deobf("blank:curios:5.14.1")
    runtimeOnly fg.deobf("blank:lazarusnpcs:1.1.0")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Pure balance math checked with plain asserts (no game needed).
tasks.register('testStealthMath', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lazarus.stealth.StealthMathTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'testStealthMath' }
